/* ============================================================

const formatFR = {
  num1: (n) => Number(n).toFixed(1).replace('.', ','),
  num2: (n) => Number(n).toFixed(2).replace('.', ','),
  int:  (n) => Math.round(Number(n)).toLocaleString('fr-FR').replace(/,/g, '\u202F'),
};
const fmtVal = (kpi) => formatFR[kpi.fmt || 'num1'](kpi.value);
const fmtPct = (curr, prev, inverse = false) => {
  const raw = ((curr - prev) / prev) * 100;
  const delta = inverse ? -raw : raw;
  return { value: delta, label: (delta >= 0 ? '+' : '') + delta.toFixed(1).replace('.', ',') + '%' };
};

function KPICard({ kpi, icon, accent = '#D9A84F', delay = 0 }) {
  const delta = fmtPct(kpi.value, kpi.prev, kpi.inverse);
  const positive = delta.value >= 0;
  const targetPct = kpi.inverse
    ? Math.min(100, Math.max(0, ((kpi.prev - kpi.value) / (kpi.prev - kpi.target)) * 100))
    : Math.min(100, Math.max(0, (kpi.value / kpi.target) * 100));

  return (
    <div className={`gradient-border p-5 fade-up`} style={{ animationDelay: `${delay}s` }}>
      <div className="flex items-start justify-between mb-4">
        <div className="w-10 h-10 rounded-lg flex items-center justify-center" style={{ background: accent + '1A', color: accent }}>
          {icon}
        </div>
        <div className={`text-xs font-semibold px-2 py-1 rounded-full flex items-center gap-1 ${positive ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>
          <svg className="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
            <path d={positive ? 'M7 17L17 7M7 7h10v10' : 'M17 7L7 17M17 17H7V7'}/>
          </svg>
          {delta.label}
        </div>
      </div>
      <div className="text-[.7rem] tracking-[.12em] uppercase text-white/50 font-semibold mb-1">{kpi.label}</div>
      <div className="flex items-baseline gap-1.5 mb-3">
        <span className="font-display text-3xl font-semibold text-white tracking-tight">{fmtVal(kpi)}</span>
        <span className="text-sm text-white/55 font-medium">{kpi.unit}</span>
      </div>
      <div className="flex items-center justify-between text-[.68rem] text-white/55 mb-1.5">
        <span>Objectif {kpi.fmt === 'int' ? formatFR.int(kpi.target) : formatFR.num1(kpi.target)} {kpi.unit}</span>
        <span className="font-mono font-semibold" style={{ color: accent }}>{targetPct.toFixed(0)}%</span>
      </div>
      <div className="h-1.5 rounded-full bg-white/5 overflow-hidden">
        <div className="h-full rounded-full transition-all" style={{ width: `${targetPct}%`, background: `linear-gradient(90deg, ${accent}, ${accent}cc)` }}></div>
      </div>
    </div>
  );
}

        <div key={i} className="flex items-center justify-between gap-3 py-0.5">
          <div className="flex items-center gap-2">
            <span className="w-2 h-2 rounded-full" style={{ background: p.color }}></span>
            <span className="text-white/70 capitalize">{p.name}</span>
          </div>
          <span className="font-mono font-semibold text-white">
            {typeof p.value === 'number' ? p.value.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) : p.value} {unit}
          </span>
        </div>
      ))}
    </div>
  );
}

function EmptyChart({ height = 260, message = "Aucune donnée pour les filtres actifs" }) {
  return (
    <div className="flex flex-col items-center justify-center gap-3 text-center" style={{ height }}>
      <div className="w-12 h-12 rounded-full bg-white/5 flex items-center justify-center border border-white/10">
        <svg className="w-5 h-5 text-white/55" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 12h8"/>
        </svg>
      </div>
      <div className="text-sm text-white/60 max-w-[260px]">{message}</div>
      <div className="text-[.68rem] text-white/55 uppercase tracking-wider">Astuce · cliquez sur « Tous les pôles »</div>
    </div>
  );
}

function ChartCard({ title, subtitle, eyebrow, right, children, className = '', delay = 0 }) {
  return (
    <div className={`gradient-border p-5 fade-up ${className}`} style={{ animationDelay: `${delay}s` }}>
      <div className="flex items-start justify-between mb-5">
        <div>
          {eyebrow && <div className="text-[.68rem] font-semibold tracking-[.16em] uppercase text-gold mb-1">{eyebrow}</div>}
          <h3 className="font-display font-semibold text-white text-lg tracking-tight">{title}</h3>
          {subtitle && <p className="text-xs text-white/50 mt-1">{subtitle}</p>}
        </div>
        {right}
      </div>
      {children}
    </div>
  );
}

function ProductionChart({ selectedPoles }) {
  const data = PRODUCTION_SERIES_2025_2026;
  const avg = data.reduce((s, d) => s + d.total, 0) / data.length;

  return (
    <ChartCard
      eyebrow="Production consolidée"
      title="Évolution production Groupe · 15 mois glissants"
      subtitle="Q1 2026 actual · kboe/j équivalent"
      delay={0.15}
      right={
        <div className="text-right">
          <div className="text-[.68rem] text-white/55 uppercase tracking-wider">Moyenne</div>
          <div className="font-mono font-semibold text-gold">{avg.toFixed(1).replace('.', ',')} kboe/j</div>
        </div>
      }>
      <ResponsiveContainer width="100%" height={260}>
        <AreaChart data={data} margin={{ top: 8, right: 8, left: -18, bottom: 0 }}>
          <defs>
            <linearGradient id="gradTotal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#D9A84F" stopOpacity={0.35}/>
              <stop offset="100%" stopColor="#D9A84F" stopOpacity={0}/>
            </linearGradient>
          </defs>
          <CartesianGrid stroke="#1A2540" strokeDasharray="3 3" vertical={false} />
          <XAxis dataKey="month" tick={{ fill: '#CBD5E1', fontSize: 10 }} axisLine={{ stroke: '#243150' }} tickLine={false} />
          <YAxis tick={{ fill: '#CBD5E1', fontSize: 10 }} axisLine={false} tickLine={false} />
          <Tooltip content={<CustomTooltip unit="kboe/j" />} cursor={{ stroke: '#D9A84F', strokeDasharray: '3 3', strokeOpacity: .4 }} />
          <ReferenceLine y={150} stroke="#10B981" strokeDasharray="4 4" strokeOpacity={.6} label={{ value: 'Target 150', fill: '#10B981', fontSize: 10, position: 'right' }} />
          <Area type="monotone" dataKey="total" name="Total Groupe" stroke="#D9A84F" strokeWidth={2.5} fill="url(#gradTotal)" />
        </AreaChart>
      </ResponsiveContainer>
    </ChartCard>
  );
}

function PoleMixChart({ selectedPoles }) {
  const filtered = POLE_MIX.filter(p => {
    const key = p.pole.toLowerCase();
    const map = { 'amont': 'amont', 'intermédiaire': 'inter', 'aval': 'aval', 'services': 'svc', 'greentech': 'energies', 'enertech': 'tech' };
    return selectedPoles.has(map[key]);
  });

  return (
    <ChartCard
      eyebrow="Mix par pôle"
      title="Contribution & croissance"
      subtitle="Q1 2026 vs Q1 2025 · unités hétérogènes (normalisées visuellement)"
      delay={0.2}
    >
      {filtered.length === 0 ? (
        <EmptyChart height={220} message="Aucun pôle sélectionné — le mix est vide" />
      ) : (
      <div className="space-y-3">
        {filtered.map((p, i) => {
          const max = Math.max(...POLE_MIX.map(x => x.value));
          const pct = (p.value / max) * 100;
          return (
            <div key={i} className="group">
              <div className="flex items-center justify-between mb-1.5">
                <div className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full" style={{ background: p.color }}></span>
                  <span className="text-sm text-white/85 font-medium">{p.pole}</span>
                </div>
                <div className="flex items-baseline gap-2">
                  <span className="font-mono text-sm text-white font-semibold">
                    {p.value.toLocaleString('fr-FR').replace(/,/g, '\u202F')} <span className="text-white/50 text-xs">{p.unit}</span>
                  </span>
                  <span className={`text-[.68rem] font-semibold ${p.delta >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                    {p.delta >= 0 ? '+' : ''}{p.delta.toFixed(1).replace('.', ',')}%
                  </span>
                </div>
              </div>
              <div className="h-2 rounded-full bg-white/5 overflow-hidden">
                <div className="h-full rounded-full transition-all duration-700 group-hover:scale-x-[1.01] origin-left"
                  style={{ width: `${pct}%`, background: `linear-gradient(90deg, ${p.color}, ${p.color}bb)` }}></div>
              </div>
            </div>
          );
        })}
      </div>
      )}
    </ChartCard>
  );
}

function CapexChart({ selectedPoles }) {
  const poleKeys = ['amont', 'inter', 'aval', 'svc', 'energies', 'tech'];
  const data = useMemo(() => CAPEX_STACKED.map(d => {
    const o = { year: d.year };
    poleKeys.forEach(k => { if (selectedPoles.has(k)) o[k] = d[k]; });
    return o;
  }), [selectedPoles]);

  // Dynamic 2026 total based on currently-selected pôles
  const total2026 = useMemo(() => {
    const row = CAPEX_STACKED[CAPEX_STACKED.length - 1];
    return poleKeys.reduce((s, k) => s + (selectedPoles.has(k) ? row[k] : 0), 0);
  }, [selectedPoles]);

  // Find last visible pôle (for radius top corners)
  const lastVisiblePoleId = useMemo(() => {
    for (let i = poleKeys.length - 1; i >= 0; i--) {
      if (selectedPoles.has(poleKeys[i])) return poleKeys[i];
    }
    return null;
  }, [selectedPoles]);

  const hasData = selectedPoles.size > 0;

  return (
    <ChartCard
      eyebrow="CAPEX"
      title="Investissements par pôle · 5 ans"
      subtitle="M USD · 2022-2026"
      delay={0.25}
      right={
        <div className="text-right">
          <div className="text-[.68rem] text-white/55 uppercase tracking-wider">
            2026 {selectedPoles.size < POLES.length && <span className="text-gold/70 normal-case">· filtré</span>}
          </div>
          <div className="font-mono font-semibold text-gold">
            {total2026.toLocaleString('fr-FR').replace(/,/g, '\u202F')} M$
          </div>
        </div>
      }
    >
      {hasData ? (
        <ResponsiveContainer width="100%" height={260}>
          <BarChart data={data} margin={{ top: 8, right: 8, left: -18, bottom: 0 }}>
            <CartesianGrid stroke="#1A2540" strokeDasharray="3 3" vertical={false} />
            <XAxis dataKey="year" tick={{ fill: '#CBD5E1', fontSize: 11 }} axisLine={{ stroke: '#243150' }} tickLine={false} />
            <YAxis tick={{ fill: '#CBD5E1', fontSize: 10 }} axisLine={false} tickLine={false} />
            <Tooltip content={<CustomTooltip unit="M$" />} cursor={{ fill: 'rgba(217,168,79,.05)' }} />
            {POLES.map(p => selectedPoles.has(p.id) && (
              <Bar key={p.id} dataKey={p.id} stackId="a" name={p.short} fill={p.color} radius={p.id === lastVisiblePoleId ? [4, 4, 0, 0] : 0} />
            ))}
          </BarChart>
        </ResponsiveContainer>
      ) : <EmptyChart height={260} message="Sélectionnez au moins un pôle pour afficher le CAPEX" />}
    </ChartCard>
  );
}

function ESGRadar() {
  return (
    <ChartCard
      eyebrow="Performance ESG"
      title="Scoring multicritères"
      subtitle="Groupe vs benchmark industrie · Q1 2026"
      delay={0.3}
    >
      <ResponsiveContainer width="100%" height={300}>
        <RadarChart data={ESG_RADAR}>
          <PolarGrid stroke="#243150" strokeOpacity={.5} />
          <PolarAngleAxis dataKey="axis" tick={{ fill: '#CBD5E1', fontSize: 10.5, fontWeight: 500 }} />
          <PolarRadiusAxis angle={30} domain={[0, 100]} tick={{ fill: '#64748B', fontSize: 9 }} stroke="#243150" />
          <Radar name="Industrie" dataKey="benchmark" stroke="#64748B" fill="#64748B" fillOpacity={0.12} strokeDasharray="4 4" />
          <Radar name="EnerTchad" dataKey="groupe" stroke="#D9A84F" fill="#D9A84F" fillOpacity={0.28} strokeWidth={2} />
          <Legend wrapperStyle={{ fontSize: 11, paddingTop: 8 }} iconSize={8} />
        </RadarChart>
      </ResponsiveContainer>
    </ChartCard>
  );
}

function DealFlowTable({ selectedPoles }) {
  const [sortKey, setSortKey] = useState('capex');
  const [sortDir, setSortDir] = useState('desc');

  const sorted = useMemo(() => {
    const filtered = DEAL_FLOW.filter(d => selectedPoles.has(d.pole));
    return filtered.slice().sort((a, b) => {
      const va = a[sortKey], vb = b[sortKey];
      const cmp = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb));
      return sortDir === 'asc' ? cmp : -cmp;
    });
  }, [sortKey, sortDir, selectedPoles]);

  const totalCapex = sorted.reduce((s, d) => s + d.capex, 0);
  const statusColors = {
    'ahead':    { bg: 'bg-emerald-500/10', text: 'text-emerald-400', label: 'En avance' },
    'on-track': { bg: 'bg-blue-500/10',    text: 'text-blue-400',    label: 'Sur plan' },
    'at-risk':  { bg: 'bg-amber-500/10',   text: 'text-amber-400',   label: 'À risque' },
  };
  const riskDots = { low: 1, medium: 2, high: 3 };

  const toggleSort = (k) => {
    if (k === sortKey) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(k); setSortDir('desc'); }
  };

  return (
    <ChartCard
      eyebrow="Deal-flow"
      title="Portefeuille projets stratégiques"
      subtitle={`${sorted.length} projets · ${totalCapex.toLocaleString('fr-FR').replace(/,/g, '\u202F')} M$ CAPEX cumulés`}
      delay={0.35}
      className="xl:col-span-2"
    >
      <div className="overflow-x-auto -mx-5 px-5">
        <table className="w-full text-sm min-w-[700px]">
          <thead>
            <tr className="text-[.68rem] font-semibold tracking-[.12em] uppercase text-white/55 border-b border-white/5">
              <th className="text-left py-3 pr-3">Projet</th>
              <th className="text-left py-3 pr-3">Pôle</th>
              <th className="text-left py-3 pr-3">Stage</th>
              <th className="text-left py-3 pr-3">Pays</th>
              <th className="text-right py-3 pr-3 cursor-pointer hover:text-gold" onClick={() => toggleSort('capex')}>
                CAPEX {sortKey === 'capex' && (sortDir === 'desc' ? '↓' : '↑')}
              </th>
              <th className="text-left py-3 pr-3">Risque</th>
              <th className="text-left py-3">Statut</th>
            </tr>
          </thead>
          <tbody>
            {sorted.map(d => {
              const pole = POLES.find(p => p.id === d.pole);
              const st = statusColors[d.status];
              return (
                <tr key={d.id} className="border-b border-white/5 hover:bg-white/3 transition-colors">
                  <td className="py-3.5 pr-3 text-white/90 font-medium">{d.project}</td>
                  <td className="py-3.5 pr-3">
                    <span className="inline-flex items-center gap-1.5 text-xs">
                      <span className="w-1.5 h-1.5 rounded-full" style={{ background: pole.color }}></span>
                      <span className="text-white/70">{pole.short}</span>
                    </span>
                  </td>
                  <td className="py-3.5 pr-3 text-white/65 text-xs">{d.stage}</td>
                  <td className="py-3.5 pr-3">
                    <span className="inline-block px-2 py-0.5 rounded-md bg-white/5 text-white/60 text-xs font-mono">{d.country}</span>
                  </td>
                  <td className="py-3.5 pr-3 text-right font-mono font-semibold text-white">{d.capex.toLocaleString('fr-FR').replace(/,/g, '\u202F')} M$</td>
                  <td className="py-3.5 pr-3">
                    <div className="flex items-center gap-0.5">
                      {[1, 2, 3].map(i => (
                        <span key={i} className={`w-1.5 h-4 rounded-sm ${i <= riskDots[d.risk] ? (d.risk === 'high' ? 'bg-rose-500' : d.risk === 'medium' ? 'bg-amber-500' : 'bg-emerald-500') : 'bg-white/10'}`}></span>
                      ))}
                    </div>
                  </td>
                  <td className="py-3.5">
                    <span className={`inline-flex items-center gap-1.5 text-[.7rem] font-semibold px-2.5 py-1 rounded-full ${st.bg} ${st.text}`}>
                      <span className="w-1 h-1 rounded-full bg-current"></span>
                      {st.label}
                    </span>
                  </td>
                </tr>
              );
            })}
            {sorted.length === 0 && (
              <tr><td colSpan={7} className="py-8 text-center text-white/55">Aucun projet pour les pôles sélectionnés.</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </ChartCard>
  );
}

function SitesCard() {
  const totalStaff = SITES.reduce((s, x) => s + x.staff, 0);
  return (
    <ChartCard
      eyebrow="Implantations"
      title="Sites opérationnels"
      subtitle={`${SITES.length} sites · ${totalStaff.toLocaleString('fr-FR').replace(/,/g, '\u202F')} collaborateurs`}
      delay={0.4}
    >
      <div className="space-y-2">
        {SITES.map((s, i) => (
          <div key={i} className="flex items-center justify-between p-2.5 rounded-lg hover:bg-white/5 transition-colors">
            <div className="flex items-center gap-3">
              <span className={`w-2 h-2 rounded-full ring-4 ${s.status === 'active' ? 'bg-emerald-400 ring-emerald-500/10' : 'bg-amber-400 ring-amber-500/10'}`}></span>
              <div>
                <div className="text-sm text-white/90 font-medium">{s.name}</div>
                <div className="text-[.7rem] text-white/55">{s.status === 'active' ? 'Opérationnel' : 'En construction'}</div>
              </div>
            </div>
            <div className="text-right">
              <div className="font-mono text-sm text-white font-semibold">{s.staff}</div>
              <div className="text-[.65rem] text-white/55 uppercase tracking-wider">staff</div>
            </div>
          </div>
        ))}
      </div>
    </ChartCard>
  );
}

/* ============================================================
   MAIN APP
   ============================================================ */

function App() {
  const [selectedPoles, setSelectedPoles] = useState(new Set(POLES.map(p => p.id)));
  const [year, setYear] = useState(2026);
  const [period, setPeriod] = useState('YTD');
  const [refreshing, setRefreshing] = useState(false);
  const [currentDate, setCurrentDate] = useState('');

  useEffect(() => {
    const d = new Date();
    setCurrentDate(d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) + ' · ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }));
  }, []);

  const togglePole = (id) => {
    setSelectedPoles(prev => {
      if (id === 'all') {
        return prev.size === POLES.length ? new Set() : new Set(POLES.map(p => p.id));
      }
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const onRefresh = () => {
    setRefreshing(true);
    setTimeout(() => setRefreshing(false), 1200);
  };

  const onExport = () => {
    const rows = [['Projet', 'Pôle', 'Stage', 'Pays', 'CAPEX (M$)', 'Risque', 'Statut']];
    DEAL_FLOW.forEach(d => {
      const pole = POLES.find(p => p.id === d.pole);
      rows.push([d.project, pole.short, d.stage, d.country, d.capex, d.risk, d.status]);
    });
    const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'enertchad-deal-flow-q1-2026.csv';
    a.click(); URL.revokeObjectURL(url);
  };

  return (
    <div className="min-h-screen">
      <Topbar currentDate={currentDate} onExport={onExport} onRefresh={onRefresh} refreshing={refreshing} />

      <FilterBar
        selectedPoles={selectedPoles}
        onTogglePole={togglePole}
        year={year}
        onYearChange={setYear}
        period={period}
        onPeriodChange={setPeriod}
      />

      <main className="max-w-[1600px] mx-auto px-6 py-6 space-y-6">

        {/* Executive summary banner */}
        <div className="gradient-border p-5 flex flex-wrap items-center justify-between gap-4 fade-up">
          <div>
            <div className="text-[.68rem] font-semibold tracking-[.18em] uppercase text-gold mb-1">Performance Q1 2026</div>
            <h2 className="font-display text-xl text-white font-semibold tracking-tight">
              Production <span className="text-gold">+4,0%</span> vs Q1 2025 · Objectif annuel consolidé en bonne voie
            </h2>
          </div>
          <div className="flex items-center gap-6">
            <div className="text-center">
              <div className="font-display text-2xl font-semibold text-white">6</div>
              <div className="text-[.68rem] text-white/50 uppercase tracking-wider">pôles actifs</div>
            </div>
            <div className="w-px h-8 bg-white/10"></div>
            <div className="text-center">
              <div className="font-display text-2xl font-semibold text-emerald-400">12</div>
              <div className="text-[.68rem] text-white/50 uppercase tracking-wider">projets en cours</div>
            </div>
            <div className="w-px h-8 bg-white/10"></div>
            <div className="text-center">
              <div className="font-display text-2xl font-semibold text-gold">1 240</div>
              <div className="text-[.68rem] text-white/50 uppercase tracking-wider">collaborateurs</div>
            </div>
          </div>
        </div>

        {/* KPI Grid */}
        <section className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <KPICard kpi={KPIS.production}   icon={ICONS.oil}     accent="#D9A84F" delay={0.02} />
          <KPICard kpi={KPIS.revenue}      icon={ICONS.money}   accent="#10B981" delay={0.04} />
          <KPICard kpi={KPIS.capex}        icon={ICONS.trend}   accent="#2C7AE0" delay={0.06} />
          <KPICard kpi={KPIS.ebitda_mgn}   icon={ICONS.factory} accent="#BE185D" delay={0.08} />
          <KPICard kpi={KPIS.hse_trir}     icon={ICONS.shield}  accent="#F59E0B" delay={0.10} />
          <KPICard kpi={KPIS.local_content}icon={ICONS.users}   accent="#8B5CF6" delay={0.12} />
          <KPICard kpi={KPIS.ghg_int}      icon={ICONS.leaf}    accent="#0891B2" delay={0.14} />
          <KPICard kpi={KPIS.transmission} icon={ICONS.bolt}    accent="#E8C36A" delay={0.16} />
        </section>

        {/* Main charts grid */}
        <section className="grid grid-cols-1 xl:grid-cols-3 gap-5">
          <div className="xl:col-span-2"><ProductionChart selectedPoles={selectedPoles} /></div>
          <PoleMixChart selectedPoles={selectedPoles} />
          <CapexChart selectedPoles={selectedPoles} />
          <ESGRadar />
          <SitesCard />
        </section>

        {/* Deal flow */}
        <section className="grid grid-cols-1 gap-5">
          <DealFlowTable selectedPoles={selectedPoles} />
        </section>

        {/* Footer strip */}
        <footer className="pt-6 pb-2 flex flex-wrap items-center justify-between gap-3 text-[.72rem] text-white/55 border-t border-white/5">
          <div>Source : EnerTchad Groupe SA/CA · Données internes · Conforme IFRS · Transparence ITIE</div>
          <div className="flex items-center gap-4">
            <span>Dashboard v2.0 · Prototype exécutif</span>
            <span className="font-mono text-gold/70">2026 Q1</span>
          </div>
        </footer>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
