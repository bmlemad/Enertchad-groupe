<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080E1A" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Erreur serveur — EnerTchad Groupe</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23D9A84F'/%3E%3Ctext x='16' y='22' font-family='Space Grotesk, sans-serif' font-weight='700' font-size='16' text-anchor='middle' fill='%23080E1A'%3EE%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    .err-wrap { min-height:100vh; display:grid; place-items:center; background:linear-gradient(180deg,#080E1A 0%,#0F1830 100%); color:#F7F6F1; text-align:center; padding:32px 24px; }
    .err-code { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(120px,20vw,220px); line-height:0.9; letter-spacing:-0.04em; background:linear-gradient(180deg,#D9A84F 0%,#8a6a28 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent; }
    .err-title { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:clamp(28px,4vw,48px); margin:16px 0 12px; color:#fff; }
    .err-text { max-width:620px; margin:0 auto 28px; color:rgba(255,255,255,0.75); font-size:17px; line-height:1.6; }
    .err-actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Aller au contenu principal</a>
  <main id="main-content" class="err-wrap">
    <div>
      <div class="err-code">500</div>
      <h1 class="err-title">Erreur serveur</h1>
      <p class="err-text">Une erreur technique est survenue. Nos équipes ont été automatiquement notifiées et travaillent à sa résolution. Merci de votre patience.</p>
      <div class="err-actions">
        <button class="btn btn-primary" onclick="location.reload()">Réessayer</button>
        <a class="btn btn-ghost" href="/" style="color:#fff;border-color:rgba(255,255,255,0.3);">Accueil</a>
        <a class="btn btn-ghost" href="/contact.html" style="color:#fff;border-color:rgba(255,255,255,0.3);">Nous contacter</a>
      </div>
    </div>
  </main>
</body>
</html>
