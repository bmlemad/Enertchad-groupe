  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    .off-wrap { min-height:100vh; display:grid; place-items:center; background:linear-gradient(180deg,#080E1A 0%,#0F1830 100%); color:#F7F6F1; text-align:center; padding:32px 24px; }
    .off-icon { width:96px; height:96px; margin:0 auto 24px; border-radius:50%; background:rgba(217,168,79,0.12); display:grid; place-items:center; border:2px solid rgba(217,168,79,0.3); }
    .off-icon svg { width:48px; height:48px; stroke:#D9A84F; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .off-title { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:clamp(28px,4vw,44px); margin:0 0 12px; color:#fff; }
    .off-text { max-width:560px; margin:0 auto 28px; color:rgba(255,255,255,0.75); font-size:17px; line-height:1.6; }
    .off-actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Aller au contenu principal</a>
  <main id="main-content" class="off-wrap">
    <div>
      <div class="off-icon"><svg viewBox="0 0 24 24"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg></div>
      <h1 class="off-title">Vous êtes hors ligne</h1>
      <p class="off-text">La connexion internet semble indisponible. Les pages déjà consultées restent accessibles grâce à notre cache hors ligne. Rechargez la page dès le retour de la connexion.</p>
      <div class="off-actions">
        <button class="btn btn-primary" onclick="location.reload()">Réessayer</button>
        <a class="btn btn-ghost on-dark" href="/">Accueil</a>
      </div>
    </div>
  </main>
</body>
