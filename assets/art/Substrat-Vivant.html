<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Substrat Vivant · Algorithmic Art</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --anthropic-dark:#141413; --anthropic-light:#faf9f5; --anthropic-mid-gray:#b0aea5;
  --anthropic-light-gray:#e8e6dc; --anthropic-orange:#d97757; --anthropic-blue:#6a9bcc; --anthropic-green:#788c5d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,var(--anthropic-light) 0%,#f5f3ee 100%);min-height:100vh;color:var(--anthropic-dark)}
.container{display:flex;min-height:100vh;padding:20px;gap:20px}
.sidebar{width:340px;flex-shrink:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);padding:24px;border-radius:12px;box-shadow:0 10px 30px rgba(20,20,19,0.1);overflow-y:auto;overflow-x:hidden}
.sidebar h1{font-family:'Lora',serif;font-size:24px;font-weight:500;color:var(--anthropic-dark);margin-bottom:8px}
.sidebar .subtitle{color:var(--anthropic-mid-gray);font-size:13px;margin-bottom:24px;line-height:1.5}
.control-section{margin-bottom:28px}
.control-section h3{font-size:15px;font-weight:600;color:var(--anthropic-dark);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.control-section h3::before{content:'•';color:var(--anthropic-orange);font-weight:bold}
.seed-input{width:100%;background:var(--anthropic-light);padding:12px;border-radius:8px;font-family:'Courier New',monospace;font-size:14px;margin-bottom:12px;border:1px solid var(--anthropic-light-gray);text-align:center}
.seed-input:focus{outline:none;border-color:var(--anthropic-orange);box-shadow:0 0 0 2px rgba(217,119,87,0.1);background:white}
.seed-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.regen-button{margin-bottom:0}
.control-group{margin-bottom:18px}
.control-group label{display:block;font-size:13px;font-weight:500;color:var(--anthropic-dark);margin-bottom:6px}
.slider-container{display:flex;align-items:center;gap:12px}
.slider-container input[type="range"]{flex:1;height:4px;background:var(--anthropic-light-gray);border-radius:2px;outline:none;-webkit-appearance:none}
.slider-container input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--anthropic-orange);border-radius:50%;cursor:pointer;transition:all 0.2s}
.slider-container input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.1);background:#c86641}
.value-display{font-family:'Courier New',monospace;font-size:12px;color:var(--anthropic-mid-gray);min-width:48px;text-align:right}
.color-group{margin-bottom:10px}
.color-group label{display:block;font-size:12px;color:var(--anthropic-mid-gray);margin-bottom:4px}
.color-picker-container{display:flex;align-items:center;gap:8px}
.color-picker-container input[type="color"]{width:32px;height:32px;border:none;border-radius:6px;cursor:pointer;background:none;padding:0}
.color-value{font-family:'Courier New',monospace;font-size:12px;color:var(--anthropic-mid-gray)}
.button{background:var(--anthropic-orange);color:white;border:none;padding:10px 16px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s;width:100%}
.button:hover{background:#c86641;transform:translateY(-1px)}
.button:active{transform:translateY(0)}
.button.secondary{background:var(--anthropic-blue)}
.button.secondary:hover{background:#5a8bb8}
.button.tertiary{background:var(--anthropic-green)}
.button.tertiary:hover{background:#6b7b52}
.button-row{display:flex;gap:8px}
.button-row .button{flex:1}
.canvas-area{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
#canvas-container{width:100%;max-width:1000px;border-radius:12px;overflow:hidden;box-shadow:0 20px 40px rgba(20,20,19,0.1);background:white}
#canvas-container canvas{display:block;width:100% !important;height:auto !important}
.loading{display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--anthropic-mid-gray);padding:60px}
.family-legend{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px;font-size:11px}
.family-legend>div{display:flex;align-items:center;gap:6px;color:var(--anthropic-mid-gray)}
.family-legend>div::before{content:'';width:10px;height:10px;border-radius:50%;flex-shrink:0}
.family-legend>div:nth-child(1)::before{background:var(--c1)}
.family-legend>div:nth-child(2)::before{background:var(--c2)}
.family-legend>div:nth-child(3)::before{background:var(--c3)}
.family-legend>div:nth-child(4)::before{background:var(--c4)}
.family-legend>div:nth-child(5)::before{background:var(--c5)}
@media(max-width:600px){.container{flex-direction:column}.sidebar{width:100%}.canvas-area{padding:20px}}
</style>
</head>
<body>
<div class="container">
<div class="sidebar">
<h1>Substrat Vivant</h1>
<div class="subtitle">5 biopolymères natifs traversant un substrat poreux · philosophie EOR Local · 2026</div>

<div class="control-section">
<h3>Seed</h3>
<input type="number" id="seed-input" class="seed-input" value="2026" onchange="updateSeed()">
<div class="seed-controls">
<button class="button secondary" onclick="previousSeed()">← Prev</button>
<button class="button secondary" onclick="nextSeed()">Next →</button>
</div>
<button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
</div>

<div class="control-section">
<h3>Paramètres algorithmiques</h3>

<div class="control-group">
<label>Densité particulaire</label>
<div class="slider-container">
<input type="range" id="particles" min="800" max="6000" step="200" value="2400" oninput="updateParam('particles', this.value)">
<span class="value-display" id="particles-value">2400</span>
</div>
</div>

<div class="control-group">
<label>Échelle porosité (sous-sol)</label>
<div class="slider-container">
<input type="range" id="noiseScale" min="0.001" max="0.012" step="0.0005" value="0.0035" oninput="updateParam('noiseScale', this.value)">
<span class="value-display" id="noiseScale-value">0.0035</span>
</div>
</div>

<div class="control-group">
<label>Vitesse imprégnation</label>
<div class="slider-container">
<input type="range" id="speed" min="0.3" max="2.5" step="0.1" value="1.0" oninput="updateParam('speed', this.value)">
<span class="value-display" id="speed-value">1.0</span>
</div>
</div>

<div class="control-group">
<label>Persistance trace</label>
<div class="slider-container">
<input type="range" id="alpha" min="3" max="40" step="1" value="14" oninput="updateParam('alpha', this.value)">
<span class="value-display" id="alpha-value">14</span>
</div>
</div>

<div class="control-group">
<label>Durée diagenèse (frames)</label>
<div class="slider-container">
<input type="range" id="duration" min="120" max="900" step="30" value="420" oninput="updateParam('duration', this.value)">
<span class="value-display" id="duration-value">420</span>
</div>
</div>
</div>

<div class="control-section">
<h3>Familles · 5 biopolymères</h3>
<div class="color-group">
<label>Natron · cristaux hexagonaux</label>
<div class="color-picker-container">
<input type="color" id="c1" value="#e8e6dc" onchange="updateColor(0, this.value)">
<span class="color-value" id="c1-value">#e8e6dc</span>
</div>
</div>
<div class="color-group">
<label>Gomme arabique · chaînes longues</label>
<div class="color-picker-container">
<input type="color" id="c2" value="#c19a5b" onchange="updateColor(1, this.value)">
<span class="color-value" id="c2-value">#c19a5b</span>
</div>
</div>
<div class="color-group">
<label>Cellulose coton · ramifications</label>
<div class="color-picker-container">
<input type="color" id="c3" value="#a0522d" onchange="updateColor(2, this.value)">
<span class="color-value" id="c3-value">#a0522d</span>
</div>
</div>
<div class="color-group">
<label>Neem & karité · spirales</label>
<div class="color-picker-container">
<input type="color" id="c4" value="#788c5d" onchange="updateColor(3, this.value)">
<span class="color-value" id="c4-value">#788c5d</span>
</div>
</div>
<div class="color-group">
<label>Spiruline · nuages microbiens</label>
<div class="color-picker-container">
<input type="color" id="c5" value="#3a5c5a" onchange="updateColor(4, this.value)">
<span class="color-value" id="c5-value">#3a5c5a</span>
</div>
</div>
</div>

<div class="control-section">
<h3>Actions</h3>
<div class="button-row">
<button class="button secondary" onclick="downloadPNG()">Download PNG</button>
<button class="button" onclick="resetParameters()">Reset</button>
</div>
</div>
</div>

<div class="canvas-area">
<div id="canvas-container">
<div class="loading">Préparation du substrat poreux...</div>
</div>
</div>
</div>

<script>
let params = {
  seed: 2026,
  particles: 2400,
  noiseScale: 0.0035,
  speed: 1.0,
  alpha: 14,
  duration: 420,
  colors: ['#e8e6dc','#c19a5b','#a0522d','#788c5d','#3a5c5a']
};
let defaultParams = JSON.parse(JSON.stringify(params));
let particles = [];
let frameCounter = 0;
let bgColor;

const FAMILIES = [
  { name: 'natron', viscosity: 0.92, curvatureBias: 0.0,  patternFn: 'crystal',  size: 1.4, octaveBlend: [0.7, 0.3, 0.0] },
  { name: 'gomme', viscosity: 0.78, curvatureBias: -0.05, patternFn: 'chain',    size: 1.0, octaveBlend: [0.4, 0.5, 0.1] },
  { name: 'cellul', viscosity: 0.85, curvatureBias: 0.18, patternFn: 'branch',   size: 1.2, octaveBlend: [0.5, 0.3, 0.2] },
  { name: 'neem', viscosity: 0.70, curvatureBias: 0.32,  patternFn: 'spiral',   size: 1.6, octaveBlend: [0.3, 0.4, 0.3] },
  { name: 'spirul', viscosity: 0.55, curvatureBias: 0.10, patternFn: 'cloud',    size: 2.2, octaveBlend: [0.2, 0.3, 0.5] }
];

function setup() {
  let c = createCanvas(1200, 1200);
  c.parent('canvas-container');
  document.querySelector('.loading').style.display = 'none';
  initializeSystem();
}

function initializeSystem() {
  randomSeed(params.seed);
  noiseSeed(params.seed);
  frameCounter = 0;
  bgColor = color(252, 250, 244);
  background(bgColor);
  
  // Subtle paper texture
  noStroke();
  for (let i = 0; i < 1800; i++) {
    fill(220 + random(-12, 12), 215 + random(-12, 12), 200 + random(-12, 12), 14);
    let r = random(0.6, 2.4);
    ellipse(random(width), random(height), r, r);
  }
  
  particles = [];
  for (let i = 0; i < params.particles; i++) {
    particles.push(new Particle(i % 5));
  }
}

function draw() {
  if (frameCounter >= params.duration) {
    finalizeRender();
    noLoop();
    return;
  }
  
  for (let p of particles) {
    p.update();
    p.render();
  }
  frameCounter++;
}

function finalizeRender() {
  // Final pass: subtle vignette
  push();
  for (let i = 0; i < 60; i++) {
    noFill();
    stroke(20, 20, 19, 1.5);
    strokeWeight(1);
    rect(i, i, width - i*2, height - i*2);
  }
  pop();
}

class Particle {
  constructor(familyIdx) {
    this.fam = FAMILIES[familyIdx];
    this.col = color(params.colors[familyIdx]);
    this.x = random(width);
    this.y = random(height);
    this.vx = 0;
    this.vy = 0;
    this.life = 0;
    this.maxLife = floor(random(80, 240));
    this.phase = random(TWO_PI);
    this.spinDir = random() < 0.5 ? -1 : 1;
    this.idx = familyIdx;
  }
  
  update() {
    // Multi-octave noise field — porous rock simulation
    let nx = this.x * params.noiseScale;
    let ny = this.y * params.noiseScale;
    let blend = this.fam.octaveBlend;
    
    let n = noise(nx, ny) * blend[0] +
            noise(nx * 2 + 100, ny * 2 + 100) * blend[1] +
            noise(nx * 4 + 200, ny * 4 + 200) * blend[2];
    
    let angle = n * TWO_PI * 2 + this.fam.curvatureBias * frameCount * 0.01;
    
    // Pattern-specific deviation
    let dx = cos(angle);
    let dy = sin(angle);
    
    if (this.fam.patternFn === 'crystal') {
      // Snap to hexagonal lattice angles
      angle = round(angle / (PI/3)) * (PI/3);
      dx = cos(angle);
      dy = sin(angle);
    } else if (this.fam.patternFn === 'chain') {
      // Almost straight, mild curve
      angle += sin(this.life * 0.04) * 0.08;
      dx = cos(angle);
      dy = sin(angle);
    } else if (this.fam.patternFn === 'branch') {
      // Periodic right-angle branches
      if (this.life > 20 && this.life % 35 === 0 && random() < 0.4) {
        angle += (random() < 0.5 ? PI/2 : -PI/2);
      }
      dx = cos(angle);
      dy = sin(angle);
    } else if (this.fam.patternFn === 'spiral') {
      // Add spiral component
      let r = this.life * 0.12;
      let spiralAngle = this.phase + this.life * 0.08 * this.spinDir;
      dx = cos(angle) * 0.5 + cos(spiralAngle) * 0.5;
      dy = sin(angle) * 0.5 + sin(spiralAngle) * 0.5;
    } else if (this.fam.patternFn === 'cloud') {
      // Brownian-ish jitter
      dx = cos(angle) * 0.7 + random(-0.4, 0.4);
      dy = sin(angle) * 0.7 + random(-0.4, 0.4);
    }
    
    let viscosity = this.fam.viscosity;
    this.vx = this.vx * viscosity + dx * params.speed * (1 - viscosity);
    this.vy = this.vy * viscosity + dy * params.speed * (1 - viscosity);
    
    this.x += this.vx;
    this.y += this.vy;
    this.life++;
    
    // Particle reset on edge or end-of-life
    if (this.x < 0 || this.x > width || this.y < 0 || this.y > height || this.life > this.maxLife) {
      this.respawn();
    }
  }
  
  respawn() {
    // Spawn from edges with bias toward where particles are sparse
    let edge = floor(random(4));
    if (edge === 0) { this.x = random(width); this.y = -10; }
    else if (edge === 1) { this.x = width + 10; this.y = random(height); }
    else if (edge === 2) { this.x = random(width); this.y = height + 10; }
    else { this.x = -10; this.y = random(height); }
    
    this.vx = 0; this.vy = 0;
    this.life = 0;
    this.maxLife = floor(random(80, 240));
    this.phase = random(TWO_PI);
  }
  
  render() {
    noStroke();
    let c = this.col;
    fill(red(c), green(c), blue(c), params.alpha);
    
    let s = this.fam.size;
    if (this.fam.patternFn === 'crystal') {
      // Hexagonal stamp
      push();
      translate(this.x, this.y);
      rotate(this.phase);
      beginShape();
      for (let i = 0; i < 6; i++) {
        let a = i * PI / 3;
        vertex(cos(a) * s * 1.3, sin(a) * s * 1.3);
      }
      endShape(CLOSE);
      pop();
    } else if (this.fam.patternFn === 'cloud') {
      // Soft halo
      ellipse(this.x, this.y, s * 1.6, s * 1.6);
      fill(red(c), green(c), blue(c), params.alpha * 0.3);
      ellipse(this.x, this.y, s * 3.5, s * 3.5);
    } else if (this.fam.patternFn === 'spiral') {
      // Tight spiral mark
      ellipse(this.x, this.y, s, s);
    } else if (this.fam.patternFn === 'branch') {
      rect(this.x - s/2, this.y - s/2, s, s);
    } else {
      ellipse(this.x, this.y, s, s);
    }
  }
}

function updateParam(name, value) {
  let v = parseFloat(value);
  document.getElementById(name + '-value').textContent = (name === 'noiseScale' || name === 'speed') ? v.toFixed(name === 'noiseScale' ? 4 : 1) : v;
  if (name === 'particles') {
    params.particles = v;
    initializeSystem();
    loop();
  } else {
    params[name] = v;
    if (name === 'duration') {
      // do not restart, let it continue
      loop();
    }
  }
}

function updateColor(idx, value) {
  params.colors[idx] = value;
  document.getElementById('c' + (idx+1) + '-value').textContent = value;
  // Update CSS legend variable
  document.documentElement.style.setProperty('--c' + (idx+1), value);
  // Don't restart — re-render existing particles will update
  for (let p of particles) {
    if (p.idx === idx) p.col = color(value);
  }
}

function updateSeed() {
  let v = parseInt(document.getElementById('seed-input').value);
  if (v && v > 0) {
    params.seed = v;
    initializeSystem();
    loop();
  }
}
function updateSeedDisplay(){ document.getElementById('seed-input').value = params.seed; }
function previousSeed(){ params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); initializeSystem(); loop(); }
function nextSeed(){ params.seed = params.seed + 1; updateSeedDisplay(); initializeSystem(); loop(); }
function randomSeedAndUpdate(){ params.seed = Math.floor(Math.random() * 999999) + 1; updateSeedDisplay(); initializeSystem(); loop(); }

function downloadPNG() {
  saveCanvas('substrat-vivant-seed' + params.seed, 'png');
}

function resetParameters() {
  params = JSON.parse(JSON.stringify(defaultParams));
  document.getElementById('particles').value = params.particles;
  document.getElementById('particles-value').textContent = params.particles;
  document.getElementById('noiseScale').value = params.noiseScale;
  document.getElementById('noiseScale-value').textContent = params.noiseScale.toFixed(4);
  document.getElementById('speed').value = params.speed;
  document.getElementById('speed-value').textContent = params.speed.toFixed(1);
  document.getElementById('alpha').value = params.alpha;
  document.getElementById('alpha-value').textContent = params.alpha;
  document.getElementById('duration').value = params.duration;
  document.getElementById('duration-value').textContent = params.duration;
  for (let i = 0; i < 5; i++) {
    document.getElementById('c' + (i+1)).value = params.colors[i];
    document.getElementById('c' + (i+1) + '-value').textContent = params.colors[i];
    document.documentElement.style.setProperty('--c' + (i+1), params.colors[i]);
  }
  updateSeedDisplay();
  initializeSystem();
  loop();
}

window.addEventListener('load', function() {
  updateSeedDisplay();
  for (let i = 0; i < 5; i++) {
    document.documentElement.style.setProperty('--c' + (i+1), params.colors[i]);
  }
});
</script>
</body>
</html>
