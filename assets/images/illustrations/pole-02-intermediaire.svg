<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Pôle 02 · Intermédiaire · pipeline">
  <title>Pôle Intermédiaire · Midstream</title>
  <g stroke="#C9B57B" fill="none" stroke-linecap="round">
    <!-- Pipeline horizontal sections -->
    <line x1="20" y1="80" x2="180" y2="80" stroke-width="6"/>
    <line x1="20" y1="80" x2="180" y2="80" stroke-width="3" stroke="#0B1A33"/>
    <!-- Connection joints -->
    <circle cx="60" cy="80" r="6" stroke-width="1.5" fill="#080E1A"/>
    <circle cx="100" cy="80" r="6" stroke-width="1.5" fill="#080E1A"/>
    <circle cx="140" cy="80" r="6" stroke-width="1.5" fill="#080E1A"/>
    <!-- Valve station -->
    <g transform="translate(100 80)">
      <rect x="-12" y="-22" width="24" height="20" stroke-width="2" fill="#C9B57B" fill-opacity="0.18"/>
      <line x1="0" y1="-2" x2="0" y2="-22" stroke-width="1.5"/>
      <circle cx="0" cy="-26" r="3" fill="#C9B57B"/>
    </g>
    <!-- Flow indicators -->
    <g stroke-width="1.5" opacity="0.55">
      <path d="M 35 75 L 45 80 L 35 85"/>
      <path d="M 75 75 L 85 80 L 75 85"/>
      <path d="M 115 75 L 125 80 L 115 85"/>
      <path d="M 155 75 L 165 80 L 155 85"/>
    </g>
    <!-- Ground -->
    <line x1="0" y1="155" x2="200" y2="155" stroke-width="1.5"/>
    <line x1="0" y1="160" x2="200" y2="160" stroke-width="0.5" opacity="0.5"/>
    <!-- Underground hint -->
    <line x1="40" y1="120" x2="55" y2="155" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.5"/>
    <line x1="160" y1="120" x2="145" y2="155" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.5"/>
  </g>
  <text x="100" y="195" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="700" fill="#C9B57B" letter-spacing="3">PÔLE 02 · INTERMÉDIAIRE</text>
</svg>
