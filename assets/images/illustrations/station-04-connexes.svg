<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Stations connexes C1-C6 · entretien lavage IRVE · canon EnerTchad SA">
  <title>C1-C6 Connexes · entretien lavage gonflage IRVE pneus huiles · 6 codes</title>
  <rect width="200" height="200" fill="#080E1A"/>
  <g stroke="#C9B57B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Service bay structure -->
    <line x1="20" y1="55" x2="180" y2="55" stroke-width="3"/>
    <line x1="30" y1="55" x2="30" y2="140" stroke-width="2.2"/>
    <line x1="170" y1="55" x2="170" y2="140" stroke-width="2.2"/>
    <line x1="100" y1="55" x2="100" y2="140" stroke-width="1.6" opacity="0.55"/>
    <text x="100" y="48" text-anchor="middle" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#C9B57B" letter-spacing="2.5">C1 — C6 CONNEXES</text>
    <!-- Bay 1 · Lavage avec voiture stylisée -->
    <g transform="translate(65 110)">
      <!-- car silhouette (brutalist line) -->
      <line x1="-22" y1="0" x2="22" y2="0" stroke-width="1.6"/>
      <line x1="-18" y1="0" x2="-12" y2="-12" stroke-width="1.6"/>
      <line x1="-12" y1="-12" x2="12" y2="-12" stroke-width="1.6"/>
      <line x1="12" y1="-12" x2="18" y2="0" stroke-width="1.6"/>
      <circle cx="-13" cy="3" r="3" stroke-width="1.4" fill="#C9B57B" fill-opacity="0.2"/>
      <circle cx="13" cy="3" r="3" stroke-width="1.4" fill="#C9B57B" fill-opacity="0.2"/>
      <!-- water spray dots -->
      <g fill="#C9B57B" stroke="none" opacity="0.7">
        <circle cx="-25" cy="-18" r="0.7"/>
        <circle cx="-20" cy="-22" r="0.6"/>
        <circle cx="-15" cy="-20" r="0.7"/>
        <circle cx="-10" cy="-23" r="0.6"/>
        <circle cx="0" cy="-22" r="0.7"/>
        <circle cx="10" cy="-23" r="0.6"/>
        <circle cx="18" cy="-21" r="0.7"/>
        <circle cx="25" cy="-18" r="0.6"/>
      </g>
      <text x="0" y="22" text-anchor="middle" font-family="Space Grotesk" font-size="5.5" font-weight="700" fill="#C9B57B">C1·WASH</text>
    </g>
    <!-- Bay 2 · IRVE charge rapide -->
    <g transform="translate(135 110)">
      <rect x="-9" y="-12" width="18" height="32" stroke-width="2" fill="#C9B57B" fill-opacity="0.32"/>
      <text x="0" y="-2" text-anchor="middle" font-family="Space Grotesk" font-size="5.5" font-weight="700" fill="#080E1A">IRVE</text>
      <!-- bolt -->
      <path d="M-2 4 L1 4 L-1 9 L2 9 L-1 14" stroke="#080E1A" stroke-width="0.9" fill="none"/>
      <text x="0" y="22" text-anchor="middle" font-family="Space Grotesk" font-size="5.5" font-weight="700" fill="#C9B57B">C5·IRVE</text>
    </g>
    <!-- Tools row floor (C2 air, C3 oil, C4 tires, C6 vac) -->
    <g transform="translate(0 145)" stroke-width="0.9" opacity="0.7">
      <g transform="translate(35 0)">
        <circle cx="0" cy="0" r="3.5"/>
        <text x="0" y="11" text-anchor="middle" font-family="Space Grotesk" font-size="5" font-weight="700" fill="#C9B57B">C2·AIR</text>
      </g>
      <g transform="translate(70 0)">
        <rect x="-3" y="-3" width="6" height="6"/>
        <text x="0" y="11" text-anchor="middle" font-family="Space Grotesk" font-size="5" font-weight="700" fill="#C9B57B">C3·OIL</text>
      </g>
      <g transform="translate(120 0)">
        <circle cx="0" cy="0" r="3.5"/>
        <circle cx="0" cy="0" r="1.6"/>
        <text x="0" y="11" text-anchor="middle" font-family="Space Grotesk" font-size="5" font-weight="700" fill="#C9B57B">C4·TIRE</text>
      </g>
      <g transform="translate(165 0)">
        <line x1="-3" y1="-3" x2="3" y2="3"/>
        <line x1="3" y1="-3" x2="-3" y2="3"/>
        <text x="0" y="11" text-anchor="middle" font-family="Space Grotesk" font-size="5" font-weight="700" fill="#C9B57B">C6·VAC</text>
      </g>
    </g>
  </g>
  <text x="100" y="180" text-anchor="middle" font-family="Space Grotesk" font-size="7" font-weight="700" fill="#C9B57B" letter-spacing="2.5">Lavage · Pneus · Huiles · Air · IRVE · Aspiration</text>
  <text x="100" y="194" text-anchor="middle" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#C9B57B" letter-spacing="3">C · CONNEXES · 6 CODES</text>
</svg>
