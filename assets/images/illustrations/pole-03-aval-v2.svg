<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Pôle Aval · Distribution + Commercialisation · Mobile Station™ 4 stations Phase 1">
 <title>Pôle Aval · Mobile Station™ Phase 1</title>
 <desc>Visualisation brutalist du pôle Aval · 4 stations N'Djamena Phase 1 ultra-premium · 13 services D+C+U06 · Mobile Station brevetée OAPI Q3 2026.</desc>

 <rect width="800" height="500" fill="#080E1A"/>

 <!-- Brutalist grid -->
 <g stroke="#C9B57B" stroke-width="0.5" opacity="0.08">
  <line x1="0" y1="100" x2="800" y2="100"/>
  <line x1="0" y1="200" x2="800" y2="200"/>
  <line x1="0" y1="300" x2="800" y2="300"/>
  <line x1="0" y1="400" x2="800" y2="400"/>
  <line x1="200" y1="0" x2="200" y2="500"/>
  <line x1="400" y1="0" x2="400" y2="500"/>
  <line x1="600" y1="0" x2="600" y2="500"/>
 </g>

 <!-- Title -->
 <text x="40" y="55" fill="#C9B57B" font-family="'Space Grotesk',sans-serif" font-size="14" letter-spacing="3.5">PÔLE 03 · AVAL · DISTRIBUTION + COMMERCIALISATION</text>
 <text x="40" y="92" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="32" font-weight="700">Mobile Station™ flagship</text>
 <text x="40" y="118" fill="#F6F1E6" font-family="'Crimson Pro',Georgia,serif" font-style="italic" font-size="18" opacity="0.85">4 stations Phase 1 · IRVE 50 cible 2030 · brevet OAPI Q3 2026.</text>

 <!-- 3 formats S/M/L -->
 <g transform="translate(40,160)">
  <text x="0" y="0" fill="#C9B57B" font-family="'Space Grotesk',sans-serif" font-size="10" letter-spacing="2">3 FORMATS MODULAIRES BREVETÉS</text>

  <!-- Format S -->
  <g transform="translate(0,14)">
   <rect width="220" height="120" fill="rgba(217,168,79,0.06)" stroke="rgba(217,168,79,0.40)" stroke-width="1"/>
   <text x="14" y="24" fill="rgba(217,168,79,0.80)" font-family="'Space Grotesk',sans-serif" font-size="10" letter-spacing="2" font-weight="700">FORMAT S · COMPACT</text>
   <text x="14" y="48" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="14" font-weight="600">600-800 m²</text>
   <text x="14" y="68" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="10" opacity="0.75">2 pompes · 4 kWc · 22 kW IRVE</text>
   <text x="14" y="86" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="9" opacity="0.55">Cible : zones secondaires</text>
   <text x="14" y="106" fill="#C9B57B" font-family="'Space Grotesk',sans-serif" font-size="9" font-weight="700">PHASE 2 · 2028+</text>
  </g>

  <!-- Format M -->
  <g transform="translate(240,14)">
   <rect width="220" height="120" fill="rgba(217,168,79,0.10)" stroke="rgba(217,168,79,0.60)" stroke-width="1.2"/>
   <text x="14" y="24" fill="#C9B57B" font-family="'Space Grotesk',sans-serif" font-size="10" letter-spacing="2" font-weight="700">FORMAT M · STANDARD</text>
   <text x="14" y="48" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="14" font-weight="600">1 000-1 400 m²</text>
   <text x="14" y="68" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="10" opacity="0.75">4 pompes · 8 kWc · 3 IRVE</text>
   <text x="14" y="86" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="9" opacity="0.55">Cible : Moundou · Sarh · Abéché</text>
   <text x="14" y="106" fill="#C9B57B" font-family="'Space Grotesk',sans-serif" font-size="9" font-weight="700">PHASE 2 · 2028-2029</text>
  </g>

  <!-- Format L FLAGSHIP -->
  <g transform="translate(480,14)">
   <rect width="220" height="120" fill="rgba(217,168,79,0.20)" stroke="#C9B57B" stroke-width="2"/>
   <text x="14" y="24" fill="#C9B57B" font-family="'Space Grotesk',sans-serif" font-size="10" letter-spacing="2" font-weight="700">FORMAT L · ULTRA-PREMIUM</text>
   <text x="14" y="48" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="14" font-weight="700">1 800-2 500 m²</text>
   <text x="14" y="68" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="10" opacity="0.85">8 pompes A1-A6 · 12 kWc · 4 IRVE 100 kW</text>
   <text x="14" y="86" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="9" opacity="0.7">Cible : 4 stations N'Djamena</text>
   <rect x="14" y="98" width="80" height="14" fill="#C9B57B"/>
   <text x="54" y="108" fill="#080E1A" font-family="'Space Grotesk',sans-serif" font-size="9" font-weight="700" text-anchor="middle">PHASE 1 · 2026</text>
  </g>
 </g>

 <!-- 4 stations N'Djamena map -->
 <g transform="translate(40,320)">
