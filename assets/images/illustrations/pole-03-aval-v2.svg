  <text x="120" y="20" fill="#C9B57B" font-family="'Space Grotesk',sans-serif" font-size="10" text-anchor="middle" font-weight="700">N'DJAMENA</text>
  <!-- 4 stations -->
  <circle cx="100" cy="40" r="6" fill="#C9B57B"/>
  <text x="100" y="45" fill="#080E1A" font-size="9" text-anchor="middle" font-weight="700">1</text>
  <circle cx="140" cy="40" r="6" fill="#C9B57B"/>
  <text x="140" y="45" fill="#080E1A" font-size="9" text-anchor="middle" font-weight="700">2</text>
  <circle cx="100" cy="65" r="6" fill="#C9B57B"/>
  <text x="100" y="70" fill="#080E1A" font-size="9" text-anchor="middle" font-weight="700">3</text>
  <circle cx="140" cy="65" r="6" fill="#C9B57B"/>
  <text x="140" y="70" fill="#080E1A" font-size="9" text-anchor="middle" font-weight="700">4</text>

  <text x="200" y="40" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="10" opacity="0.85">Sabangali ultra-premium · CAPEX 8 M USD</text>
  <text x="200" y="58" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="10" opacity="0.85">8 pompes · IRVE 50-100 kW · solaire 12 kWc</text>
  <text x="200" y="76" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="10" opacity="0.85">B1-B6 boutique premium · C1-C6 lave-auto</text>
 </g>

 <!-- KPI bar -->
 <g transform="translate(40,420)">
  <rect width="720" height="60" fill="#1a2030" stroke="#C9B57B" stroke-width="1"/>
  <g font-family="'Space Grotesk',sans-serif">
   <text x="20" y="22" fill="#C9B57B" font-size="9" letter-spacing="1.5">BUSINESS CASE PHASE 1 · 4 STATIONS · CENTRAL</text>
   <text x="40" y="48" fill="#F6F1E6" font-size="20" font-weight="700">8 M USD</text>
   <text x="40" y="58" fill="#F6F1E6" font-size="8" opacity="0.7">CAPEX Phase 1</text>
   <text x="220" y="48" fill="#F6F1E6" font-size="20" font-weight="700">27%</text>
   <text x="220" y="58" fill="#F6F1E6" font-size="8" opacity="0.7">IRR central 5 ans</text>
   <text x="400" y="48" fill="#F6F1E6" font-size="20" font-weight="700">22 mois</text>
   <text x="400" y="58" fill="#F6F1E6" font-size="8" opacity="0.7">Payback central</text>
   <text x="540" y="48" fill="#F6F1E6" font-size="20" font-weight="700">50 stations</text>
   <text x="540" y="58" fill="#F6F1E6" font-size="8" opacity="0.7">Cible 2030 pan-CEMAC</text>
  </g>
 </g>
