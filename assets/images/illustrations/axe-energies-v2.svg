<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Axe Énergies · 8 services E01-E08 · solaire IRVE 50 biomasse Net Zero 2050">
 <title>Axe Énergies · transition mix énergétique</title>
 <desc>Visualisation brutalist axe Énergies · 8 services E01-E08 · solaire 10 MW · IRVE 50 cible 2030 · biomasse · Net Zero 2050.</desc>
 <rect width="800" height="500" fill="#080E1A"/>
 <g stroke="#10B981" stroke-width="0.5" opacity="0.08">
  <line x1="0" y1="100" x2="800" y2="100"/>
  <line x1="0" y1="200" x2="800" y2="200"/>
  <line x1="0" y1="300" x2="800" y2="300"/>
  <line x1="0" y1="400" x2="800" y2="400"/>
  <line x1="200" y1="0" x2="200" y2="500"/>
  <line x1="400" y1="0" x2="400" y2="500"/>
  <line x1="600" y1="0" x2="600" y2="500"/>
 </g>
 <text x="40" y="55" fill="#10B981" font-family="'Space Grotesk',sans-serif" font-size="14" letter-spacing="3.5">AXE 02 · ÉNERGIES · TRANSITION MIX</text>
 <text x="40" y="92" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="32" font-weight="700">8 services E01-E08</text>
 <text x="40" y="118" fill="#F6F1E6" font-family="'Crimson Pro',Georgia,serif" font-style="italic" font-size="18" opacity="0.85">Solaire · IRVE 50 · biomasse · Net Zero 2050.</text>

 <!-- Phase trajectory · 2026 → 2050 -->
 <g transform="translate(40,170)">
  <text x="0" y="0" fill="#10B981" font-family="'Space Grotesk',sans-serif" font-size="10" letter-spacing="2">TRAJECTOIRE MIX ÉNERGÉTIQUE · 30 → 70 → 100%</text>
  <!-- 2026 baseline -->
  <rect x="0" y="14" width="220" height="100" fill="rgba(16,185,129,0.10)" stroke="#10B981" stroke-width="1.2"/>
  <text x="14" y="34" fill="#10B981" font-family="'Space Grotesk',sans-serif" font-size="10" font-weight="700">PHASE 1 · 2026-2027</text>
  <text x="14" y="56" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="22" font-weight="700">30%</text>
  <text x="14" y="78" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="10" opacity="0.85">Mix renouvelable · pilotes</text>
  <text x="14" y="98" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="9" opacity="0.6">10 MW solaire · 4 IRVE Phase 1</text>

  <!-- 2030 target -->
  <rect x="240" y="14" width="220" height="100" fill="rgba(16,185,129,0.18)" stroke="#10B981" stroke-width="1.5"/>
  <text x="254" y="34" fill="#10B981" font-family="'Space Grotesk',sans-serif" font-size="10" font-weight="700">PHASE 2-3 · 2028-2030</text>
  <text x="254" y="56" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="22" font-weight="700">70%</text>
  <text x="254" y="78" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="10" opacity="0.85">Cible 2030 mix vert</text>
  <text x="254" y="98" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="9" opacity="0.6">50 IRVE 2030 · 25 stations</text>

  <!-- 2050 Net Zero -->
  <rect x="480" y="14" width="220" height="100" fill="rgba(217,168,79,0.20)" stroke="#C9B57B" stroke-width="2"/>
  <text x="494" y="34" fill="#C9B57B" font-family="'Space Grotesk',sans-serif" font-size="10" font-weight="700">2050 · NET ZERO</text>
  <text x="494" y="56" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="22" font-weight="700">100%</text>
  <text x="494" y="78" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="10" opacity="0.85">Renouvelable + carbon offset</text>
  <text x="494" y="98" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="9" opacity="0.6">5 phases sustainability</text>
 </g>

 <!-- Services row -->
 <g transform="translate(40,310)">
  <text x="0" y="0" fill="#10B981" font-family="'Space Grotesk',sans-serif" font-size="10" letter-spacing="2">CATALOGUE · 8 SERVICES E01-E08</text>
  <g font-family="'Space Grotesk',sans-serif" fill="#F6F1E6" font-size="9">
   <circle cx="5" cy="22" r="3" fill="#10B981"/><text x="14" y="26">E01 · Solaire 10 MW</text>
   <circle cx="155" cy="22" r="3" fill="#10B981"/><text x="164" y="26">E02 · IRVE 50 stations</text>
   <circle cx="305" cy="22" r="3" fill="#10B981"/><text x="314" y="26">E03 · Biomasse</text>
   <circle cx="455" cy="22" r="3" fill="#10B981"/><text x="464" y="26">E04 · BESS storage</text>
   <circle cx="5" cy="44" r="3" fill="#10B981"/><text x="14" y="48">E05 · Smart grid</text>
   <circle cx="155" cy="44" r="3" fill="#10B981"/><text x="164" y="48">E06 · Hydrogène pilote</text>
   <circle cx="305" cy="44" r="3" fill="#10B981"/><text x="314" y="48">E07 · Éolien étude</text>
   <circle cx="455" cy="44" r="3" fill="#10B981"/><text x="464" y="48">E08 · Energy mgmt</text>
  </g>
 </g>

 <!-- KPI bar -->
 <g transform="translate(40,420)">
  <rect width="720" height="60" fill="#1a2030" stroke="#10B981" stroke-width="1"/>
  <g font-family="'Space Grotesk',sans-serif">
   <text x="20" y="22" fill="#10B981" font-size="9" letter-spacing="1.5">CIBLES · ÉNERGIES PHASE 1 → 2030</text>
   <text x="40" y="48" fill="#F6F1E6" font-size="20" font-weight="700">10 MW</text>
   <text x="40" y="58" fill="#F6F1E6" font-size="8" opacity="0.7">Solaire cible 2030</text>
   <text x="220" y="48" fill="#F6F1E6" font-size="20" font-weight="700">50 IRVE</text>
   <text x="220" y="58" fill="#F6F1E6" font-size="8" opacity="0.7">Bornes 2030</text>
   <text x="400" y="48" fill="#F6F1E6" font-size="20" font-weight="700">100%</text>
   <text x="400" y="58" fill="#F6F1E6" font-size="8" opacity="0.7">Net Zero 2050</text>
   <text x="540" y="48" fill="#F6F1E6" font-size="20" font-weight="700">-60%</text>
   <text x="540" y="58" fill="#F6F1E6" font-size="8" opacity="0.7">Intensité hydrique</text>
  </g>
 </g>
</svg>
