<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Axe transversal Énergies · solaire · IRVE · biomasse">
  <title>Axe Énergies · E01-E08 · Solaire · IRVE · Biomasse · transition</title>
  <rect width="200" height="200" fill="#080E1A"/>
  <g stroke="#C9B57B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sun with rays (solar) -->
    <circle cx="55" cy="60" r="14" stroke-width="2.2" fill="#C9B57B" fill-opacity="0.20"/>
    <g stroke-width="1.2">
      <line x1="55" y1="38" x2="55" y2="32"/>
      <line x1="55" y1="82" x2="55" y2="88"/>
      <line x1="33" y1="60" x2="27" y2="60"/>
      <line x1="77" y1="60" x2="83" y2="60"/>
      <line x1="38" y1="43" x2="34" y2="39"/>
      <line x1="72" y1="77" x2="76" y2="81"/>
      <line x1="72" y1="43" x2="76" y2="39"/>
      <line x1="38" y1="77" x2="34" y2="81"/>
    </g>
    <!-- IRVE charger right · gold accent -->
    <g transform="translate(140 60)">
      <rect x="-12" y="-15" width="24" height="40" stroke-width="2.2" fill="#C9B57B" fill-opacity="0.32"/>
      <rect x="-9" y="-11" width="18" height="9" stroke-width="0.8" fill="#080E1A"/>
      <text x="0" y="-4" text-anchor="middle" font-family="Space Grotesk" font-size="6" font-weight="700" fill="#C9B57B">IRVE</text>
      <path d="M-3 4 L1 4 L-2 10 L2 10 L-1 16" stroke="#080E1A" stroke-width="1.2" fill="none"/>
    </g>
    <!-- Biomass below · circular cycle -->
    <g transform="translate(100 140)">
      <circle cx="0" cy="0" r="22" stroke-width="2" stroke-dasharray="3 2"/>
      <text x="0" y="3" text-anchor="middle" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#C9B57B">BIOMASSE</text>
    </g>
    <!-- Connecting flow -->
    <g stroke-width="0.5" opacity="0.5">
      <path d="M55 80 Q80 110 100 120"/>
      <path d="M140 90 Q120 110 100 120"/>
    </g>
  </g>
  <text x="100" y="195" text-anchor="middle" font-family="Space Grotesk" font-size="10" font-weight="700" fill="#C9B57B" letter-spacing="3">E · ÉNERGIES · 8 SERVICES</text>
</svg>
