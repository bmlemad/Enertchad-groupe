<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="IRVE 50 · réseau bornes de recharge VE Tchad · canon EnerTchad SA">
  <title>IRVE · 50 bornes de recharge véhicules électriques · Tchad 2030 · canon EnerTchad SA</title>
  <rect width="200" height="200" fill="#080E1A"/>
  <g stroke="#C9B57B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Map subtle grid -->
    <g stroke-width="0.4" opacity="0.18">
      <line x1="20" y1="40" x2="180" y2="40"/>
      <line x1="20" y1="80" x2="180" y2="80"/>
      <line x1="20" y1="120" x2="180" y2="120"/>
      <line x1="20" y1="160" x2="180" y2="160"/>
      <line x1="40" y1="20" x2="40" y2="180"/>
      <line x1="80" y1="20" x2="80" y2="180"/>
      <line x1="120" y1="20" x2="120" y2="180"/>
      <line x1="160" y1="20" x2="160" y2="180"/>
    </g>
    <!-- Tchad outline simplified -->
    <path d="M50 50 L130 35 L155 70 L165 110 L150 155 L75 165 L40 130 L35 80 Z"
          stroke-width="1.6" stroke-dasharray="2 2" opacity="0.55"/>
    <!-- Central charger station (gold filled) -->
    <g transform="translate(100 95)">
      <rect x="-14" y="-22" width="28" height="42" stroke-width="2.2" fill="#C9B57B" fill-opacity="0.32"/>
      <rect x="-11" y="-18" width="22" height="11" stroke-width="0.9" fill="#080E1A"/>
      <text x="0" y="-9" text-anchor="middle" font-family="Space Grotesk" font-size="7" font-weight="700" fill="#C9B57B">IRVE</text>
      <!-- Bolt symbol -->
      <path d="M-4 0 L2 0 L-2 8 L4 8 L-2 18" stroke="#080E1A" stroke-width="1.6" fill="none"/>
      <line x1="-14" y1="20" x2="14" y2="20" stroke-width="0.6" opacity="0.5"/>
    </g>
    <!-- 6 satellite chargers (gold dots) representing 50 -->
    <g fill="#C9B57B" stroke="#C9B57B" stroke-width="0.6">
      <circle cx="55" cy="60" r="2.2" fill-opacity="0.7"/>
      <circle cx="80" cy="50" r="2.2" fill-opacity="0.7"/>
      <circle cx="140" cy="55" r="2.2" fill-opacity="0.7"/>
      <circle cx="155" cy="105" r="2.2" fill-opacity="0.7"/>
      <circle cx="60" cy="140" r="2.2" fill-opacity="0.7"/>
      <circle cx="135" cy="150" r="2.2" fill-opacity="0.7"/>
    </g>
    <!-- Connecting lines (network) -->
    <g stroke-width="0.4" opacity="0.45">
      <line x1="100" y1="95" x2="55" y2="60"/>
      <line x1="100" y1="95" x2="80" y2="50"/>
      <line x1="100" y1="95" x2="140" y2="55"/>
      <line x1="100" y1="95" x2="155" y2="105"/>
      <line x1="100" y1="95" x2="60" y2="140"/>
      <line x1="100" y1="95" x2="135" y2="150"/>
    </g>
    <!-- Power values labels around -->
    <text x="55" y="55" text-anchor="middle" font-family="Space Grotesk" font-size="4.5" font-weight="700" fill="#C9B57B">22kW</text>
    <text x="80" y="45" text-anchor="middle" font-family="Space Grotesk" font-size="4.5" font-weight="700" fill="#C9B57B">50kW</text>
    <text x="140" y="50" text-anchor="middle" font-family="Space Grotesk" font-size="4.5" font-weight="700" fill="#C9B57B">22kW</text>
    <text x="155" y="100" text-anchor="middle" font-family="Space Grotesk" font-size="4.5" font-weight="700" fill="#C9B57B">150kW</text>
    <text x="60" y="135" text-anchor="middle" font-family="Space Grotesk" font-size="4.5" font-weight="700" fill="#C9B57B">22kW</text>
    <text x="135" y="145" text-anchor="middle" font-family="Space Grotesk" font-size="4.5" font-weight="700" fill="#C9B57B">50kW</text>
  </g>
  <!-- Bottom labels -->
  <text x="100" y="180" text-anchor="middle" font-family="Space Grotesk" font-size="7" font-weight="700" fill="#C9B57B" letter-spacing="2.5">22 kW · 50 kW · 150 kW · OCPP 2.0 · Solar-backed</text>
  <text x="100" y="194" text-anchor="middle" font-family="Space Grotesk" font-size="10" font-weight="700" fill="#C9B57B" letter-spacing="3">IRVE · 50 BORNES · TCHAD 2030</text>
</svg>
