<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Axe transversal HSE · OIMS-grade integrated safety">
  <title>Axe HSE · 16 services H01-H08 + W01-W04 + O01-O04 · OIMS-grade</title>
  <rect width="200" height="200" fill="#080E1A"/>
  <g stroke="#C9B57B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shield centered -->
    <path d="M100 35 L130 50 L130 100 Q130 130 100 145 Q70 130 70 100 L70 50 Z" stroke-width="2.5" fill="#C9B57B" fill-opacity="0.10"/>
    <!-- Plus + cross inside shield -->
    <g stroke-width="2">
      <line x1="100" y1="65" x2="100" y2="115"/>
      <line x1="80" y1="90" x2="120" y2="90"/>
    </g>
    <!-- Three rings around (H · W · O) -->
    <g transform="translate(45 75)" stroke-width="1.5">
      <circle cx="0" cy="0" r="12" fill="#C9B57B" fill-opacity="0.10"/>
      <text x="0" y="3" text-anchor="middle" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#C9B57B">H</text>
    </g>
    <g transform="translate(155 75)" stroke-width="1.5">
      <circle cx="0" cy="0" r="12" fill="#C9B57B" fill-opacity="0.10"/>
      <text x="0" y="3" text-anchor="middle" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#C9B57B">W</text>
    </g>
    <g transform="translate(100 165)" stroke-width="1.5">
      <circle cx="0" cy="0" r="12" fill="#C9B57B" fill-opacity="0.10"/>
      <text x="0" y="3" text-anchor="middle" font-family="Space Grotesk" font-size="11" font-weight="700" fill="#C9B57B">O</text>
    </g>
    <!-- Connection lines -->
    <g stroke-width="0.5" opacity="0.4">
      <line x1="55" y1="80" x2="80" y2="85"/>
      <line x1="145" y1="80" x2="120" y2="85"/>
      <line x1="100" y1="145" x2="100" y2="155"/>
    </g>
  </g>
  <text x="100" y="195" text-anchor="middle" font-family="Space Grotesk" font-size="10" font-weight="700" fill="#C9B57B" letter-spacing="3">H+W+O · HSE · 16 SERVICES</text>
</svg>
