<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Sustainability · Net Zero 2050 · 5 phases · 3 piliers ESG">
 <title>Sustainability · trajectoire Net Zero 2050</title>
 <desc>Visualisation brutalist trajectoire Net Zero 2050 · 5 phases · 3 piliers ESG · GHG inventory · -60% intensité hydrique · 30→70→100% renouvelable.</desc>
 <rect width="800" height="500" fill="#080E1A"/>
 <g stroke="#10B981" stroke-width="0.5" opacity="0.08">
  <line x1="0" y1="100" x2="800" y2="100"/>
  <line x1="0" y1="200" x2="800" y2="200"/>
  <line x1="0" y1="300" x2="800" y2="300"/>
  <line x1="0" y1="400" x2="800" y2="400"/>
  <line x1="200" y1="0" x2="200" y2="500"/>
  <line x1="400" y1="0" x2="400" y2="500"/>
  <line x1="600" y1="0" x2="600" y2="500"/>
 </g>
 <text x="40" y="55" fill="#10B981" font-family="'Space Grotesk',sans-serif" font-size="14" letter-spacing="3.5">SUSTAINABILITY · NET ZERO 2050</text>
 <text x="40" y="92" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="32" font-weight="700">5 phases · 3 piliers ESG</text>
 <text x="40" y="118" fill="#F6F1E6" font-family="'Crimson Pro',Georgia,serif" font-style="italic" font-size="18" opacity="0.85">2026 → 2030 → 2040 → 2050. Trajectoire vérifiable.</text>

 <!-- 5 phases timeline -->
 <g transform="translate(40,170)">
  <text x="0" y="0" fill="#10B981" font-family="'Space Grotesk',sans-serif" font-size="10" letter-spacing="2">5 PHASES · TRAJECTOIRE QUANTIFIÉE</text>
  <!-- Timeline line -->
  <line x1="0" y1="50" x2="720" y2="50" stroke="#10B981" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Phase 1 · 2026-2027 -->
  <g transform="translate(0,30)">
   <circle cx="20" cy="20" r="14" fill="#10B981"/>
   <text x="20" y="24" fill="#080E1A" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="700" text-anchor="middle">1</text>
   <text x="20" y="60" fill="#10B981" font-family="'Space Grotesk',sans-serif" font-size="9" letter-spacing="1.5" text-anchor="middle" font-weight="700">2026-27</text>
   <text x="20" y="78" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="14" font-weight="700" text-anchor="middle">30%</text>
   <text x="20" y="92" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="8" text-anchor="middle" opacity="0.75">Mix vert</text>
  </g>

  <!-- Phase 2 · 2028-2029 -->
  <g transform="translate(180,30)">
   <circle cx="20" cy="20" r="14" fill="#10B981"/>
   <text x="20" y="24" fill="#080E1A" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>
   <text x="20" y="60" fill="#10B981" font-family="'Space Grotesk',sans-serif" font-size="9" letter-spacing="1.5" text-anchor="middle" font-weight="700">2028-29</text>
   <text x="20" y="78" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="14" font-weight="700" text-anchor="middle">50%</text>
   <text x="20" y="92" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="8" text-anchor="middle" opacity="0.75">Scale-up vert</text>
  </g>

  <!-- Phase 3 · 2030 -->
  <g transform="translate(360,30)">
   <circle cx="20" cy="20" r="16" fill="#C9B57B"/>
   <text x="20" y="24" fill="#080E1A" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>
   <text x="20" y="60" fill="#C9B57B" font-family="'Space Grotesk',sans-serif" font-size="9" letter-spacing="1.5" text-anchor="middle" font-weight="700">2030</text>
   <text x="20" y="78" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="14" font-weight="700" text-anchor="middle">70%</text>
   <text x="20" y="92" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="8" text-anchor="middle" opacity="0.75">Net Zero ramp</text>
  </g>

  <!-- Phase 4 · 2040 -->
  <g transform="translate(540,30)">
   <circle cx="20" cy="20" r="14" fill="#10B981"/>
   <text x="20" y="24" fill="#080E1A" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="700" text-anchor="middle">4</text>
   <text x="20" y="60" fill="#10B981" font-family="'Space Grotesk',sans-serif" font-size="9" letter-spacing="1.5" text-anchor="middle" font-weight="700">2040</text>
   <text x="20" y="78" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="14" font-weight="700" text-anchor="middle">90%</text>
   <text x="20" y="92" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="8" text-anchor="middle" opacity="0.75">Decarb avancé</text>
  </g>

  <!-- Phase 5 · 2050 -->
  <g transform="translate(700,30)">
   <circle cx="20" cy="20" r="18" fill="#C9B57B" stroke="#10B981" stroke-width="2"/>
   <text x="20" y="24" fill="#080E1A" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="700" text-anchor="middle">5</text>
   <text x="20" y="60" fill="#C9B57B" font-family="'Space Grotesk',sans-serif" font-size="9" letter-spacing="1.5" text-anchor="middle" font-weight="700">2050</text>
   <text x="20" y="78" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="14" font-weight="700" text-anchor="middle">100%</text>
   <text x="20" y="92" fill="#F6F1E6" font-family="'Space Grotesk',sans-serif" font-size="8" text-anchor="middle" opacity="0.75">NET ZERO</text>
  </g>
 </g>

 <!-- 3 piliers ESG -->
 <g transform="translate(40,310)">
  <text x="0" y="0" fill="#10B981" font-family="'Space Grotesk',sans-serif" font-size="10" letter-spacing="2">3 PILIERS ESG · ENGAGEMENTS VÉRIFIABLES</text>

  <rect x="0" y="14" width="230" height="80" fill="rgba(16,185,129,0.10)" stroke="#10B981" stroke-width="1.2"/>
  <text x="14" y="34" fill="#10B981" font-size="11" font-weight="700">⚐ E · ENVIRONNEMENT</text>
  <text x="14" y="52" fill="#F6F1E6" font-size="10">GHG inventory cross-pôles</text>
  <text x="14" y="68" fill="#F6F1E6" font-size="10">-60% intensité hydrique 2030</text>
  <text x="14" y="84" fill="#F6F1E6" font-size="10">Zero-discharge stations 2030</text>

  <rect x="245" y="14" width="230" height="80" fill="rgba(217,168,79,0.10)" stroke="#C9B57B" stroke-width="1.2"/>
  <text x="259" y="34" fill="#C9B57B" font-size="11" font-weight="700">⚐ S · SOCIAL</text>
  <text x="259" y="52" fill="#F6F1E6" font-size="10">LCD 75-90% local content</text>
  <text x="259" y="68" fill="#F6F1E6" font-size="10">200 ETP/an EnerAcademy</text>
  <text x="259" y="84" fill="#F6F1E6" font-size="10">30% femmes Phase 1 · 40% P3</text>

  <rect x="490" y="14" width="230" height="80" fill="rgba(79,143,217,0.10)" stroke="#4F8FD9" stroke-width="1.2"/>
  <text x="504" y="34" fill="#4F8FD9" font-size="11" font-weight="700">⚐ G · GOVERNANCE</text>
  <text x="504" y="52" fill="#F6F1E6" font-size="10">OHADA · ITIE · OAPI</text>
  <text x="504" y="68" fill="#F6F1E6" font-size="10">Code conduite + anti-corruption</text>
  <text x="504" y="84" fill="#F6F1E6" font-size="10">Audit Big 4 cible 2027</text>
 </g>

 <!-- KPI bar -->
 <g transform="translate(40,420)">
  <rect width="720" height="60" fill="#1a2030" stroke="#10B981" stroke-width="1"/>
  <g font-family="'Space Grotesk',sans-serif">
   <text x="20" y="22" fill="#10B981" font-size="9" letter-spacing="1.5">CIBLES 2030 · TRAJECTOIRE NET ZERO 2050</text>
   <text x="40" y="48" fill="#F6F1E6" font-size="20" font-weight="700">-30%</text>
   <text x="40" y="58" fill="#F6F1E6" font-size="8" opacity="0.7">CO₂eq vs 2026</text>
   <text x="220" y="48" fill="#F6F1E6" font-size="20" font-weight="700">-60%</text>
   <text x="220" y="58" fill="#F6F1E6" font-size="8" opacity="0.7">Intensité hydrique</text>
   <text x="400" y="48" fill="#F6F1E6" font-size="20" font-weight="700">75%</text>
   <text x="400" y="58" fill="#F6F1E6" font-size="8" opacity="0.7">Recyclage eau</text>
   <text x="540" y="48" fill="#F6F1E6" font-size="20" font-weight="700">10 MW</text>
   <text x="540" y="58" fill="#F6F1E6" font-size="8" opacity="0.7">Solaire installé</text>
  </g>
 </g>
</svg>
