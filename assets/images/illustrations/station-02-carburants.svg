<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Stations carburants A1-A6 · canon EnerTchad SA">
  <title>A1-A6 Carburants · pompes essence diesel kérosène · 6 codes</title>
  <rect width="200" height="200" fill="#080E1A"/>
  <g stroke="#C9B57B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Canopy -->
    <line x1="20" y1="50" x2="180" y2="50" stroke-width="3.5"/>
    <line x1="20" y1="55" x2="180" y2="55" stroke-width="0.6" opacity="0.5"/>
    <!-- Pillars -->
