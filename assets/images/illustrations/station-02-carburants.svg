  <text x="100" y="180" text-anchor="middle" font-family="Space Grotesk" font-size="7" font-weight="700" fill="#C9B57B" letter-spacing="2.5">Essence · Diesel · Kérosène · GPL · AdBlue · GNV</text>
  <text x="100" y="194" text-anchor="middle" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#C9B57B" letter-spacing="3">A · CARBURANTS · 6 CODES</text>
