      <rect x="-7" y="5" width="14" height="8" stroke-width="0.7" fill="#080E1A"/>
      <text x="0" y="11" text-anchor="middle" font-family="Space Grotesk" font-size="5.5" font-weight="700" fill="#C9B57B">A3·KER</text>
      <line x1="5" y1="0" x2="5" y2="-7" stroke-width="1.2"/>
      <line x1="5" y1="-7" x2="10" y2="-12" stroke-width="1.2"/>
      <circle cx="10" cy="-12" r="1.3" fill="#C9B57B"/>
