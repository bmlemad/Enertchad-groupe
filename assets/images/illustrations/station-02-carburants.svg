    <text x="100" y="42" text-anchor="middle" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#C9B57B" letter-spacing="2.5">A1 — A6 CARBURANTS</text>
    <!-- 3 pumps row -->
    <g transform="translate(55 105)">
      <rect x="-9" y="0" width="18" height="35" stroke-width="1.8" fill="#C9B57B" fill-opacity="0.10"/>
      <rect x="-7" y="5" width="14" height="8" stroke-width="0.7" fill="#080E1A"/>
      <text x="0" y="11" text-anchor="middle" font-family="Space Grotesk" font-size="5.5" font-weight="700" fill="#C9B57B">A1·95</text>
      <line x1="-5" y1="0" x2="-5" y2="-7" stroke-width="1.2"/>
      <line x1="-5" y1="-7" x2="-10" y2="-12" stroke-width="1.2"/>
      <circle cx="-10" cy="-12" r="1.3" fill="#C9B57B"/>
    </g>
    <g transform="translate(100 105)">
      <rect x="-9" y="0" width="18" height="35" stroke-width="1.8" fill="#C9B57B" fill-opacity="0.10"/>
      <rect x="-7" y="5" width="14" height="8" stroke-width="0.7" fill="#080E1A"/>
      <text x="0" y="11" text-anchor="middle" font-family="Space Grotesk" font-size="5.5" font-weight="700" fill="#C9B57B">A2·DIE</text>
      <line x1="0" y1="0" x2="0" y2="-7" stroke-width="1.2"/>
      <line x1="0" y1="-7" x2="-6" y2="-12" stroke-width="1.2"/>
      <circle cx="-6" cy="-12" r="1.3" fill="#C9B57B"/>
    </g>
    <g transform="translate(145 105)">
