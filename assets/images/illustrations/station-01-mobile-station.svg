<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Mobile Station™ · concept canon EnerTchad SA">
  <title>Mobile Station™ · station modulaire next-gen · canon EnerTchad SA</title>
  <!-- Background subtle navy -->
  <rect width="320" height="200" fill="#080E1A"/>
  <!-- Stars / subtle constellation -->
  <g fill="#C9B57B" opacity="0.18">
    <circle cx="40" cy="25" r="0.8"/>
    <circle cx="120" cy="18" r="1"/>
    <circle cx="220" cy="28" r="0.7"/>
    <circle cx="290" cy="22" r="1"/>
    <circle cx="60" cy="40" r="0.6"/>
  </g>
  <g stroke="#C9B57B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sky horizon line -->
    <line x1="0" y1="80" x2="320" y2="80" stroke-width="0.4" opacity="0.3"/>
    <!-- Canopy structure (modular) -->
    <line x1="40" y1="58" x2="280" y2="58" stroke-width="3.5"/>
    <line x1="40" y1="65" x2="280" y2="65" stroke-width="0.6" opacity="0.5"/>
    <!-- Canopy support pillars -->
    <line x1="55" y1="58" x2="55" y2="135" stroke-width="2.4"/>
    <line x1="265" y1="58" x2="265" y2="135" stroke-width="2.4"/>
    <line x1="160" y1="58" x2="160" y2="135" stroke-width="1.6" opacity="0.6"/>
    <!-- Logo brand on canopy -->
    <text x="160" y="50" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="700" fill="#C9B57B" letter-spacing="2.2">MOBILE STATION™</text>
    <!-- Module 1 · Carburant pump -->
    <g transform="translate(85 110)">
      <rect x="-12" y="0" width="24" height="40" stroke-width="2" fill="#C9B57B" fill-opacity="0.10"/>
      <rect x="-9" y="6" width="18" height="9" stroke-width="0.9" fill="#080E1A"/>
      <text x="0" y="13" text-anchor="middle" font-family="Space Grotesk" font-size="6" font-weight="700" fill="#C9B57B">95</text>
      <line x1="-12" y1="22" x2="12" y2="22" stroke-width="0.7" opacity="0.5"/>
      <line x1="-7" y1="0" x2="-7" y2="-9" stroke-width="1.4"/>
      <line x1="-7" y1="-9" x2="-13" y2="-15" stroke-width="1.4"/>
      <circle cx="-13" cy="-15" r="1.6" fill="#C9B57B"/>
    </g>
    <!-- Module 2 · IRVE EV charger center · gold filled accent -->
    <g transform="translate(160 110)">
      <rect x="-12" y="0" width="24" height="40" stroke-width="2" fill="#C9B57B" fill-opacity="0.32"/>
      <rect x="-9" y="6" width="18" height="9" stroke-width="0.9" fill="#080E1A"/>
      <text x="0" y="13" text-anchor="middle" font-family="Space Grotesk" font-size="6" font-weight="700" fill="#C9B57B">IRVE</text>
      <text x="0" y="28" text-anchor="middle" font-family="Space Grotesk" font-size="5" font-weight="600" fill="#080E1A">22-150 kW</text>
      <!-- bolt icon -->
      <path d="M-3 32 L1 32 L-2 38 L3 38 L-1 44" stroke="#080E1A" stroke-width="0.9" fill="none"/>
    </g>
    <!-- Module 3 · Carburant pump -->
    <g transform="translate(235 110)">
      <rect x="-12" y="0" width="24" height="40" stroke-width="2" fill="#C9B57B" fill-opacity="0.10"/>
      <rect x="-9" y="6" width="18" height="9" stroke-width="0.9" fill="#080E1A"/>
      <text x="0" y="13" text-anchor="middle" font-family="Space Grotesk" font-size="6" font-weight="700" fill="#C9B57B">DIESEL</text>
      <line x1="-12" y1="22" x2="12" y2="22" stroke-width="0.7" opacity="0.5"/>
      <line x1="7" y1="0" x2="7" y2="-9" stroke-width="1.4"/>
      <line x1="7" y1="-9" x2="13" y2="-15" stroke-width="1.4"/>
      <circle cx="13" cy="-15" r="1.6" fill="#C9B57B"/>
    </g>
    <!-- Solar panels on canopy -->
    <g stroke-width="0.7" opacity="0.7">
      <line x1="60" y1="48" x2="100" y2="48"/>
      <line x1="60" y1="52" x2="100" y2="52"/>
      <line x1="120" y1="48" x2="160" y2="48"/>
      <line x1="120" y1="52" x2="160" y2="52"/>
      <line x1="180" y1="48" x2="220" y2="48"/>
      <line x1="180" y1="52" x2="220" y2="52"/>
      <line x1="240" y1="48" x2="270" y2="48"/>
      <line x1="240" y1="52" x2="270" y2="52"/>
    </g>
    <!-- Ground · double line -->
    <line x1="20" y1="158" x2="300" y2="158" stroke-width="1.6"/>
    <line x1="20" y1="163" x2="300" y2="163" stroke-width="0.5" opacity="0.5"/>
    <!-- Ground texture dots -->
    <g fill="#C9B57B" stroke="none" opacity="0.4">
      <circle cx="35" cy="170" r="0.6"/>
      <circle cx="120" cy="172" r="0.6"/>
      <circle cx="200" cy="170" r="0.6"/>
      <circle cx="285" cy="172" r="0.6"/>
    </g>
  </g>
  <!-- Bottom label -->
  <text x="160" y="190" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="9" font-weight="700" fill="#C9B57B" letter-spacing="3.5">MOBILE STATION™ · MODULAIRE · SOLAIRE · IRVE</text>
</svg>
