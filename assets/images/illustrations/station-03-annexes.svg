<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Stations annexes B1-B6 · boutique restauration · canon EnerTchad SA">
  <title>B1-B6 Annexes · boutique · café · restauration · sanitaires · 6 codes</title>
  <rect width="200" height="200" fill="#080E1A"/>
  <g stroke="#C9B57B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Building structure -->
    <rect x="35" y="55" width="130" height="100" stroke-width="2.4" fill="#C9B57B" fill-opacity="0.08"/>
    <!-- Roof line accent -->
    <line x1="32" y1="55" x2="168" y2="55" stroke-width="3"/>
    <!-- Brand label on facade -->
    <text x="100" y="48" text-anchor="middle" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#C9B57B" letter-spacing="2.5">B1 — B6 ANNEXES</text>
    <!-- Window grid · 4 windows -->
    <g stroke-width="1.4">
      <rect x="48" y="70" width="22" height="28" stroke-width="1.4"/>
      <line x1="59" y1="70" x2="59" y2="98" stroke-width="0.6" opacity="0.6"/>
      <line x1="48" y1="84" x2="70" y2="84" stroke-width="0.6" opacity="0.6"/>
      <rect x="78" y="70" width="22" height="28" stroke-width="1.4"/>
      <line x1="89" y1="70" x2="89" y2="98" stroke-width="0.6" opacity="0.6"/>
      <line x1="78" y1="84" x2="100" y2="84" stroke-width="0.6" opacity="0.6"/>
      <rect x="108" y="70" width="22" height="28" stroke-width="1.4"/>
      <line x1="119" y1="70" x2="119" y2="98" stroke-width="0.6" opacity="0.6"/>
      <line x1="108" y1="84" x2="130" y2="84" stroke-width="0.6" opacity="0.6"/>
    </g>
    <!-- Door (gold accent) -->
    <rect x="138" y="105" width="20" height="50" stroke-width="1.8" fill="#C9B57B" fill-opacity="0.32"/>
    <line x1="148" y1="105" x2="148" y2="155" stroke-width="0.5" opacity="0.6"/>
    <circle cx="154" cy="130" r="0.9" fill="#C9B57B"/>
    <!-- Sub-icons (B1 boutique, B2 café, B3 restauration, B4 sanitaires) -->
    <g transform="translate(58 120)">
      <rect x="-8" y="-3" width="16" height="10" stroke-width="1" fill="none"/>
      <text x="0" y="20" text-anchor="middle" font-family="Space Grotesk" font-size="5.5" font-weight="700" fill="#C9B57B">B1·SHOP</text>
    </g>
    <g transform="translate(89 120)">
      <circle cx="0" cy="0" r="5" stroke-width="1" fill="none"/>
      <line x1="3" y1="-3" x2="6" y2="-7" stroke-width="0.7"/>
      <text x="0" y="20" text-anchor="middle" font-family="Space Grotesk" font-size="5.5" font-weight="700" fill="#C9B57B">B2·CAFÉ</text>
    </g>
    <g transform="translate(120 120)">
      <rect x="-7" y="-2" width="14" height="6" stroke-width="1" fill="none"/>
      <line x1="-7" y1="3" x2="7" y2="3" stroke-width="0.7"/>
      <text x="0" y="20" text-anchor="middle" font-family="Space Grotesk" font-size="5.5" font-weight="700" fill="#C9B57B">B3·RESTO</text>
    </g>
    <!-- Ground -->
    <line x1="15" y1="160" x2="185" y2="160" stroke-width="1.4"/>
    <line x1="15" y1="165" x2="185" y2="165" stroke-width="0.5" opacity="0.5"/>
