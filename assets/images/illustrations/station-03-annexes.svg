  <text x="100" y="180" text-anchor="middle" font-family="Space Grotesk" font-size="7" font-weight="700" fill="#C9B57B" letter-spacing="2.5">Boutique · Café · Restauration · Sanitaires · WiFi · Lounge</text>
  <text x="100" y="194" text-anchor="middle" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#C9B57B" letter-spacing="3">B · ANNEXES · 6 CODES</text>
