<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Pôle 03 · Aval · station service Mobile Station™">
  <title>Pôle Aval · Downstream · Mobile Station™</title>
  <g stroke="#C9B57B" fill="none" stroke-linecap="round">
    <!-- Canopy/auvent -->
    <line x1="30" y1="60" x2="170" y2="60" stroke-width="4"/>
    <line x1="40" y1="60" x2="40" y2="120" stroke-width="2.5"/>
    <line x1="160" y1="60" x2="160" y2="120" stroke-width="2.5"/>
    <line x1="35" y1="70" x2="165" y2="70" stroke-width="0.8" opacity="0.5"/>
    <!-- Logo on canopy -->
    <text x="100" y="55" text-anchor="middle" font-family="Space Grotesk" font-size="10" font-weight="700" fill="#C9B57B" letter-spacing="1.5">MOBILE STATION™</text>
    <!-- Pumps -->
    <g transform="translate(70 100)">
      <rect x="-8" y="0" width="16" height="32" stroke-width="2" fill="#C9B57B" fill-opacity="0.10"/>
      <line x1="-8" y1="8" x2="8" y2="8" stroke-width="1"/>
      <line x1="-3" y1="0" x2="-3" y2="-8" stroke-width="1.5"/>
      <line x1="-3" y1="-8" x2="-8" y2="-12" stroke-width="1.5"/>
    </g>
    <g transform="translate(130 100)">
      <rect x="-8" y="0" width="16" height="32" stroke-width="2" fill="#C9B57B" fill-opacity="0.10"/>
      <line x1="-8" y1="8" x2="8" y2="8" stroke-width="1"/>
      <line x1="3" y1="0" x2="3" y2="-8" stroke-width="1.5"/>
      <line x1="3" y1="-8" x2="8" y2="-12" stroke-width="1.5"/>
    </g>
    <!-- IRVE charger center · gold accent -->
    <g transform="translate(100 100)">
      <rect x="-7" y="0" width="14" height="32" stroke-width="2" fill="#C9B57B" fill-opacity="0.28"/>
      <text x="0" y="20" text-anchor="middle" font-family="Space Grotesk" font-size="9" font-weight="700" fill="#080E1A">IRVE</text>
    </g>
    <!-- Ground -->
    <line x1="20" y1="155" x2="180" y2="155" stroke-width="1.5"/>
    <line x1="20" y1="160" x2="180" y2="160" stroke-width="0.5" opacity="0.5"/>
  </g>
  <text x="100" y="195" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="700" fill="#C9B57B" letter-spacing="3">PÔLE 03 · AVAL</text>
</svg>
