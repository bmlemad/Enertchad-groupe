<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Pôle 04 · Pétrochimie · tour de cracking">
  <title>Pôle Pétrochimie</title>
  <g stroke="#C9B57B" fill="none" stroke-linecap="round">
    <!-- Tall distillation tower (left) -->
    <g transform="translate(60 30)">
      <rect x="-12" y="0" width="24" height="125" stroke-width="2" fill="#C9B57B" fill-opacity="0.06"/>
      <line x1="-12" y1="20" x2="12" y2="20" stroke-width="1"/>
      <line x1="-12" y1="40" x2="12" y2="40" stroke-width="1"/>
      <line x1="-12" y1="60" x2="12" y2="60" stroke-width="1"/>
      <line x1="-12" y1="80" x2="12" y2="80" stroke-width="1"/>
      <line x1="-12" y1="100" x2="12" y2="100" stroke-width="1"/>
      <!-- Cap dome -->
      <path d="M -12 0 Q 0 -10 12 0" stroke-width="2"/>
      <!-- Steam top -->
      <path d="M -2 -10 Q -4 -16 0 -22" stroke-width="1" opacity="0.5"/>
      <path d="M 2 -10 Q 4 -16 0 -22" stroke-width="1" opacity="0.5"/>
    </g>
    <!-- Shorter cracker (right) -->
    <g transform="translate(135 65)">
      <rect x="-10" y="0" width="20" height="90" stroke-width="2" fill="#C9B57B" fill-opacity="0.06"/>
      <line x1="-10" y1="20" x2="10" y2="20" stroke-width="1"/>
      <line x1="-10" y1="50" x2="10" y2="50" stroke-width="1"/>
      <line x1="-10" y1="70" x2="10" y2="70" stroke-width="1"/>
      <path d="M -10 0 Q 0 -8 10 0" stroke-width="2"/>
    </g>
    <!-- Connecting pipework -->
    <line x1="72" y1="100" x2="125" y2="100" stroke-width="1.5"/>
    <line x1="72" y1="115" x2="125" y2="115" stroke-width="1"/>
    <!-- Output pipes -->
    <line x1="60" y1="155" x2="60" y2="145" stroke-width="1.5"/>
    <line x1="135" y1="155" x2="135" y2="145" stroke-width="1.5"/>
    <!-- Ground -->
    <line x1="20" y1="155" x2="180" y2="155" stroke-width="1.5"/>
    <line x1="20" y1="160" x2="180" y2="160" stroke-width="0.5" opacity="0.5"/>
  </g>
  <text x="100" y="195" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="700" fill="#C9B57B" letter-spacing="3">PÔLE 04 · PÉTROCHIMIE</text>
</svg>
