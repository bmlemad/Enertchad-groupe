[build]
  publish = "."

# Custom 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Legacy path redirects (anciennes URLs → nouvelles)
[[redirects]]
  from = "/about"
  to = "/groupe.html"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/groupe.html"
  status = 301

[[redirects]]
  from = "/investors"
  to = "/investisseurs.html"
  status = 301

[[redirects]]
  from = "/careers"
  to = "/talents.html"
  status = 301

[[redirects]]
  from = "/sustainability"
  to = "/durabilite.html"
  status = 301

[[redirects]]
  from = "/news"
  to = "/actualites.html"
  status = 301

[[redirects]]
  from = "/upstream"
  to = "/operations/amont.html"
  status = 301

[[redirects]]
  from = "/midstream"
  to = "/operations/intermediaire.html"
  status = 301

[[redirects]]
  from = "/downstream"
  to = "/operations/aval.html"
  status = 301

[[redirects]]
  from = "/services"
  to = "/operations/services.html"
  status = 301

# Clean URL rewrites (optionnel — .html masqué)
[[redirects]]
  from = "/groupe"
  to = "/groupe.html"
  status = 200

[[redirects]]
  from = "/investisseurs"
  to = "/investisseurs.html"
  status = 200

[[redirects]]
  from = "/durabilite"
  to = "/durabilite.html"
  status = 200

[[redirects]]
  from = "/talents"
  to = "/talents.html"
  status = 200

[[redirects]]
  from = "/actualites"
  to = "/actualites.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Security + performance headers — all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# Long-lived cache for static assets
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — shorter cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"
